name: firmware-build

on:
  push:
  pull_request:

jobs:
  platformio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install platformio==6.1.18
      - run: pio run -e fulgur_pixel -e aurora_pixel -e fulgur_dmx -e aurora_dmx

[platformio]
default_envs = fulgur_pixel

[env]
platform = espressif32@6.13.0
framework = arduino
monitor_speed = 115200
lib_deps =
    fastled/FastLED@3.9.15
build_flags =
    -DARTNET_UNIVERSE=0
    -DARTNET_PORT=6454
    -DARTNET_TIMEOUT_MS=1500

; ---------------------------------------------------------------------------
; Current tabletop builds: PL9823 local preview only
; FULGUR and AURORA both use Wireless-Tag WT32-ETH01 hardware.
; Node identity remains separate through NODE_FULGUR / NODE_AURORA.
; ---------------------------------------------------------------------------

[env:fulgur_pixel]
board = wt32-eth01
build_flags =
    ${env.build_flags}
    -DNODE_FULGUR=1
    -DOUTPUT_MODE_PIXEL=1

[env:aurora_pixel]
board = wt32-eth01
build_flags =
    ${env.build_flags}
    -DNODE_AURORA=1
    -DOUTPUT_MODE_PIXEL=1

; ---------------------------------------------------------------------------
; DMX builds: PL9823 local preview remains active in parallel.
; These require an RS-485 output stage to be physically added before use.
; ---------------------------------------------------------------------------

[env:fulgur_dmx]
board = wt32-eth01
build_flags =
    ${env.build_flags}
    -DNODE_FULGUR=1
    -DOUTPUT_MODE_DMX=1

[env:aurora_dmx]
board = wt32-eth01
build_flags =
    ${env.build_flags}
    -DNODE_AURORA=1
    -DOUTPUT_MODE_DMX=1

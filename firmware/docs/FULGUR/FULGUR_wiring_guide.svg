<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1250" viewBox="0 0 1800 1250">
  <defs>
    <style>
      text { font-family: "Yu Gothic", "Meiryo", sans-serif; fill: #172033; }
      .h1 { font-size: 38px; font-weight: 900; fill: #fff; }
      .h2 { font-size: 23px; font-weight: 900; }
      .body { font-size: 16px; }
      .small { font-size: 14px; }
      .tiny { font-size: 12px; }
      .mono { font-family: "Cascadia Mono", "Consolas", monospace; }
      .card { fill: #fff; stroke: #cbd5e1; stroke-width: 2; rx: 16; }
      .wire5 { stroke: #dc2626; stroke-width: 6; fill: none; stroke-linecap: round; }
      .wire3 { stroke: #f59e0b; stroke-width: 6; fill: none; stroke-linecap: round; }
      .wired { stroke: #0f766e; stroke-width: 6; fill: none; stroke-linecap: round; }
      .wireg { stroke: #111827; stroke-width: 6; fill: none; stroke-linecap: round; }
    </style>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.12"/></filter>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker>
  </defs>
  <rect width="1800" height="1250" fill="#f1f5f9"/>
  <rect width="1800" height="96" fill="#172033"/>
  <text class="h1" x="48" y="58">FULGUR — はじめて組む人の配線ガイド</text>
  <text x="1330" y="58" font-size="17" font-weight="700" fill="#cbd5e1">電源を入れずに、上から順番に作業</text>

  <rect x="45" y="112" width="1710" height="74" rx="14" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
  <text x="70" y="143" font-size="20" font-weight="900" fill="#be123c">絶対ルール：外部5V・PoE・Micro-USBを同時に接続しない</text>
  <text class="body" x="70" y="170">この設計は「5V/2Aアダプターだけ」で動かす。LANはPoEなし。通電は全配線とテスター確認が終わってから。</text>

  <!-- left: step cards -->
  <g filter="url(#s)"><rect class="card" x="45" y="210" width="810" height="265"/></g>
  <circle cx="90" cy="253" r="24" fill="#172033"/><text x="90" y="261" text-anchor="middle" font-size="20" font-weight="900" fill="#fff">1</text>
  <text class="h2" x="130" y="262">電源リングを作る</text>
  <rect x="75" y="292" width="155" height="74" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text class="body" x="152" y="319" text-anchor="middle" font-weight="800">5V/2A</text><text class="small" x="152" y="345" text-anchor="middle">ACアダプター</text>
  <rect x="295" y="292" width="125" height="74" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text class="body" x="357" y="319" text-anchor="middle" font-weight="800">主電源</text><text class="small" x="357" y="345" text-anchor="middle">ロッカーSW</text>
  <path class="wire5" d="M230 315H295M420 315H780"/>
  <path class="wireg" d="M230 350H780"/>
  <text class="small" x="455" y="302" fill="#dc2626">赤：+5V（中心端子→スイッチ→各部品）</text>
  <text class="small" x="455" y="379">黒：GND（外周端子→各部品）</text>
  <rect x="75" y="401" width="704" height="48" rx="8" fill="#fffbeb"/>
  <text class="small" x="92" y="431" fill="#92400e">プロレスで言うと電源は「会場のブレーカー」。最後まで上げない。</text>

  <g filter="url(#s)"><rect class="card" x="45" y="500" width="810" height="300"/></g>
  <circle cx="90" cy="543" r="24" fill="#172033"/><text x="90" y="551" text-anchor="middle" font-size="20" font-weight="900" fill="#fff">2</text>
  <text class="h2" x="130" y="552">ESP32とICをつなぐ</text>
  <rect x="75" y="590" width="230" height="150" rx="14" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text class="body" x="190" y="620" text-anchor="middle" font-weight="900">ESP32-POE</text>
  <text class="small mono" x="95" y="650">+5V  ← 赤</text><text class="small mono" x="95" y="676">GND  ← 黒</text><text class="small mono" x="95" y="702" fill="#0f766e">GPIO4 → IC pin2</text>
  <rect x="490" y="575" width="275" height="182" rx="14" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/>
  <path d="M575 575q52 45 104 0" fill="none" stroke="#7e22ce" stroke-width="2"/>
  <text class="body" x="627" y="612" text-anchor="middle" font-weight="900">SN74AHCT125N</text>
  <text class="small mono" x="520" y="642">pin14 = +5V</text><text class="small mono" x="520" y="666">pin 7 = GND</text><text class="small mono" x="520" y="690">pin 1 = GND</text><text class="small mono" x="520" y="714">pin 2 ← GPIO4</text><text class="small mono" x="520" y="738">pin 3 → R0 75Ω</text>
  <path class="wired" d="M305 695H490" marker-end="url(#a)"/>
  <text class="tiny" x="392" y="684" text-anchor="middle" fill="#0f766e">3.3Vデータ</text>
  <text class="small" x="75" y="780">ICソケット推奨：ソケットだけをはんだ付けし、ICは通電前チェック後に挿す。</text>

  <g filter="url(#s)"><rect class="card" x="45" y="825" width="810" height="360"/></g>
  <circle cx="90" cy="868" r="24" fill="#172033"/><text x="90" y="876" text-anchor="middle" font-size="20" font-weight="900" fill="#fff">3</text>
  <text class="h2" x="130" y="877">SAFE / ARMをつなぐ</text>
  <rect x="75" y="920" width="190" height="105" rx="15" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text class="body" x="170" y="950" text-anchor="middle" font-weight="900">赤ミサイルSW</text>
  <text class="small" x="170" y="977" text-anchor="middle">+ / OUT / GND</text>
  <path class="wire3" d="M75 950H52"/><text class="tiny" x="65" y="937" fill="#b45309">3.3V</text>
  <path class="wired" d="M265 950H580" marker-end="url(#a)"/>
  <rect x="590" y="916" width="180" height="68" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text class="body" x="680" y="946" text-anchor="middle" font-weight="900">GPIO14</text><text class="small" x="680" y="969" text-anchor="middle">ARM入力</text>
  <path class="wireg" d="M170 1025V1080H770"/>
  <path d="M420 950V1025" stroke="#64748b" stroke-width="3"/>
  <rect x="393" y="995" width="54" height="28" rx="4" fill="#fef3c7" stroke="#92400e"/>
  <text class="tiny" x="420" y="1014" text-anchor="middle">10kΩ</text>
  <text class="small" x="75" y="1120">SAFE = GPIO14がGNDへ10kΩで引かれてLOW</text>
  <text class="small" x="75" y="1148">ARM = スイッチから3.3Vが来てHIGH（5Vを入れない）</text>

  <!-- right: LED chain -->
  <g filter="url(#s)"><rect class="card" x="885" y="210" width="870" height="590"/></g>
  <circle cx="930" cy="253" r="24" fill="#172033"/><text x="930" y="261" text-anchor="middle" font-size="20" font-weight="900" fill="#fff">4</text>
  <text class="h2" x="970" y="262">LEDを1灯ずつ、同じ向きでつなぐ</text>
  <text class="body" x="915" y="300">足番号で判断する。色・足の長さだけを信用しない。PL9823の資料でpin 1位置を確認。</text>

  <rect x="915" y="330" width="380" height="190" rx="14" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text class="h2" x="1105" y="365" text-anchor="middle">PL9823-F8 1個の4本</text>
  <circle cx="985" cy="420" r="32" fill="#cbd5e1" stroke="#0f172a" stroke-width="2"/><text class="h2" x="985" y="428" text-anchor="middle">1</text>
  <circle cx="1065" cy="420" r="32" fill="#99f6e4" stroke="#0f766e" stroke-width="2"/><text class="h2" x="1065" y="428" text-anchor="middle">2</text>
  <circle cx="1145" cy="420" r="32" fill="#fecaca" stroke="#dc2626" stroke-width="2"/><text class="h2" x="1145" y="428" text-anchor="middle">3</text>
  <circle cx="1225" cy="420" r="32" fill="#bae6fd" stroke="#0369a1" stroke-width="2"/><text class="h2" x="1225" y="428" text-anchor="middle">4</text>
  <text class="small" x="985" y="474" text-anchor="middle">GND</text><text class="small" x="1065" y="474" text-anchor="middle">DOUT</text><text class="small" x="1145" y="474" text-anchor="middle">+5V</text><text class="small" x="1225" y="474" text-anchor="middle">DIN</text>
  <text class="tiny" x="1105" y="505" text-anchor="middle" fill="#475569">これは機能対応表。実物の左右順は必ずデータシートのpin番号で照合。</text>

  <rect x="1320" y="330" width="400" height="190" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text class="h2" x="1520" y="365" text-anchor="middle">各LEDで必ず反復</text>
  <text class="body mono" x="1350" y="405">pin1 → GND（黒）</text>
  <text class="body mono" x="1350" y="436">pin3 → +5V（赤）</text>
  <text class="body mono" x="1350" y="467">pin1 ─ 0.1µF ─ pin3</text>
  <text class="small" x="1350" y="497">コンデンサに向きはない。足は短く。</text>

  <text class="body" x="915" y="560" font-weight="900">データの入場順（逆走禁止）</text>
  <g transform="translate(915 590)">
    <rect x="0" y="0" width="92" height="55" rx="8" fill="#f3e8ff" stroke="#7e22ce"/><text class="small" x="46" y="23" text-anchor="middle" font-weight="800">IC pin3</text><text class="tiny" x="46" y="42" text-anchor="middle">1Y</text>
    <text class="small" x="115" y="22" text-anchor="middle">75Ω</text><path class="wired" d="M92 33H143" marker-end="url(#a)"/>
    <rect x="145" y="0" width="84" height="55" rx="8" fill="#ecfeff" stroke="#0891b2"/><text class="small" x="187" y="33" text-anchor="middle" font-weight="800">LED1</text>
    <text class="small" x="255" y="22" text-anchor="middle">75Ω</text><path class="wired" d="M229 33H283" marker-end="url(#a)"/>
    <rect x="285" y="0" width="84" height="55" rx="8" fill="#ecfeff" stroke="#0891b2"/><text class="small" x="327" y="33" text-anchor="middle" font-weight="800">LED2</text>
    <text class="small" x="395" y="22" text-anchor="middle">75Ω</text><path class="wired" d="M369 33H423" marker-end="url(#a)"/>
    <rect x="425" y="0" width="84" height="55" rx="8" fill="#ecfeff" stroke="#0891b2"/><text class="small" x="467" y="33" text-anchor="middle" font-weight="800">LED3</text>
    <text class="body" x="540" y="35">… → LED6</text>
  </g>
  <text class="small mono" x="915" y="690">LED1 DOUT(pin2) → R1 → LED2 DIN(pin4)</text>
  <text class="small mono" x="915" y="718">LED2 → R2 → LED3 → R3 → LED4 → R4 → LED5 → R5 → LED6</text>
  <text class="small mono" x="915" y="746">LED6 DOUT(pin2) は未接続</text>
  <rect x="915" y="760" width="805" height="28" rx="6" fill="#fffbeb"/>
  <text class="tiny" x="930" y="779" fill="#92400e">最初はLED1だけを接続して点灯確認。成功後に2→3→…→6と増やす。</text>

  <!-- right lower checks -->
  <g filter="url(#s)"><rect class="card" x="885" y="825" width="870" height="360"/></g>
  <circle cx="930" cy="868" r="24" fill="#172033"/><text x="930" y="876" text-anchor="middle" font-size="20" font-weight="900" fill="#fff">5</text>
  <text class="h2" x="970" y="877">テスター確認 → 初通電</text>
  <rect x="915" y="915" width="390" height="215" rx="12" fill="#f8fafc" stroke="#94a3b8"/>
  <text class="body" x="940" y="948" font-weight="900">電源OFF・全部抜いた状態</text>
  <text class="small" x="940" y="982">□ 各USB流用線の両端が導通する</text>
  <text class="small" x="940" y="1014">□ 隣の線とは導通しない</text>
  <text class="small" x="940" y="1046">□ +5V と GND が短絡していない</text>
  <text class="small" x="940" y="1078">□ IC/LEDの向き、抵抗値を再確認</text>
  <text class="tiny" x="940" y="1110" fill="#475569">※ブザーが一瞬だけ鳴る場合はコンデンサ充電のこともある</text>
  <rect x="1330" y="915" width="390" height="215" rx="12" fill="#ecfdf5" stroke="#059669"/>
  <text class="body" x="1355" y="948" font-weight="900">初通電（LED1だけ）</text>
  <text class="small" x="1355" y="982">□ ICを挿す前に +5V / 3.3V を測る</text>
  <text class="small" x="1355" y="1014">□ 電源OFF後、ICを正しい向きで挿す</text>
  <text class="small" x="1355" y="1046">□ 異臭・発熱・煙なら即OFF</text>
  <text class="small" x="1355" y="1078">□ LED1成功後、1灯ずつ追加</text>
  <text class="tiny" x="1355" y="1110" fill="#047857">困ったら電源を切り、写真を撮って配線を照合</text>

  <text class="tiny" x="48" y="1225" fill="#475569">配線の完全版は「FULGUR_circuit_schematic.svg」、作業順は「FULGUR_build_checklist.md」を参照。</text>
</svg>
